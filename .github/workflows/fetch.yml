name: Fetch Proxies and CF IPs

on:
  schedule:
    # 每天北京时间 08:15（UTC 00:15）执行，位于 Cloudflare Workers 每日免费额度重置（北京时间 08:00 / UTC 00:00）之后，并微调 15 分钟避开整点排队
    - cron: "15 0 * * *"
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发运行
    inputs:
      fetch_days:
        description: "回溯天数 (默认 3 天)"
        required: false
        default: "3"
      cf_check_endpoint:
        description: "SSTP 出口检测端点 URL (需自行部署 CF-Workers-CheckSocks5，留空则不执行外部检测)"
        required: false
        default: ""

concurrency:
  group: fetch-proxies
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 安装依赖
        run: pip install -r requirements.txt

      - name: 🛡️ 语法与变量静态预检
        run: |
          python -m py_compile *.py
          pip install ruff
          ruff check . --select F82
          python providers.py --validate
          python -m unittest discover -s tests

      - name: 📡 抓取 TG 代理与优选 IP
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STR: ${{ secrets.TG_SESSION_STR }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FETCH_DAYS: ${{ inputs.fetch_days || vars.FETCH_DAYS || '3' }}
          PROXY: ${{ vars.PROXY }}
          PROXY_CHANNELS: ${{ vars.PROXY_CHANNELS }}
          CF_IP_CHANNELS: ${{ vars.CF_IP_CHANNELS }}
          SUB_URLS: ${{ vars.SUB_URLS }}
          DEFER_NOTIFY: "1"
        run: python tg_fetch.py

      - name: 🚀 通用代理多协议连通性质检
        env:
          CF_CHECK_ENDPOINT: ${{ inputs.cf_check_endpoint || vars.CF_CHECK_ENDPOINT || secrets.CF_CHECK_ENDPOINT || '' }}
        run: python proxies_verify.py --concurrency 300 --max-fails 3 --no-notify

      - name: 🔍 ProxyIP 穿透存活质检
        run: python proxyip_verify.py --concurrency 250 --max-fails 3 --no-notify

      - name: 🛡️ 优选 IP 两阶段主动校验（TLS + 301）
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python cf_verify.py --concurrency 250 --max-fails 3 --timeout 3.0

      - name: 🚨 任务失败告警推送
        if: failure()
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -c "from providers import send_ci_failure_alert; send_ci_failure_alert()"

      - name: 📄 提交并推送数据
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -d data ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git reset -- data/.fetch_stats.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "⏭️ 节点与优选 IP 无新变化，跳过提交"
            else
              git commit -m "🔄 chore(update): refresh proxies and cf ips in data/ [skip ci]"
              git pull --rebase --autostash origin main
              git push
              echo "✅ 已成功提交并推送 data/ 节点与优选 IP 数据"
            fi
          else
            echo "⚠️ 目标目录未生成，请检查上一步运行日志"
          fi

      - name: 🧹 清理旧工作流记录（保留最近 4 次运行记录）
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 4
